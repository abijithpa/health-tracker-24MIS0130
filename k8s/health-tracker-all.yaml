# ====================================================================
# Health Tracker - Complete Kubernetes Deployment (v1, v2, v3)
# Roll No: 24MIS0130 | Topic: Health Tracker
# 3 Separate Deployments + 3 Separate Services on different ports
# ====================================================================

# -------------------------- VERSION 1 --------------------------
# Feature: Enter Data – Input health values
apiVersion: apps/v1
kind: Deployment
metadata:
  name: health-tracker-v1-deployment
  labels:
    app: health-tracker
    version: v1
    student: "24MIS0130"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: health-tracker
      version: v1
  template:
    metadata:
      labels:
        app: health-tracker
        version: v1
        student: "24MIS0130"
    spec:
      containers:
      - name: health-tracker-v1
        image: 24mis0130/health-tracker:v1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
        env:
        - name: PORT
          value: "3000"
        - name: APP_VERSION
          value: "v1"
---
apiVersion: v1
kind: Service
metadata:
  name: health-tracker-v1-service
  labels:
    app: health-tracker
    version: v1
spec:
  type: NodePort
  selector:
    app: health-tracker
    version: v1
  ports:
  - port: 8081
    targetPort: 3000
    nodePort: 30001
    name: http-v1

---
