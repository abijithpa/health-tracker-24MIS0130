---
# ====================================================================
# Health Tracker - Version 2 Deployment & Service
# Roll No: 24MIS0130 | Feature: View (Display records)
# ====================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: health-tracker-v2-deployment
  labels:
    app: health-tracker
    version: v2
    student: "24MIS0130"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: health-tracker
      version: v2
  template:
    metadata:
      labels:
        app: health-tracker
        version: v2
        student: "24MIS0130"
    spec:
      containers:
      - name: health-tracker-v2
        image: 24mis0130/health-tracker:v2
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: PORT
          value: "3000"
        - name: APP_VERSION
          value: "v2"
        resources:
          limits:
            cpu: "250m"
            memory: "256Mi"
          requests:
            cpu: "100m"
            memory: "128Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: health-tracker-v2-service
  labels:
    app: health-tracker
    version: v2
    student: "24MIS0130"
spec:
  type: NodePort
  selector:
    app: health-tracker
    version: v2
  ports:
  - port: 8082
    targetPort: 3000
    nodePort: 30002
    name: http-v2
