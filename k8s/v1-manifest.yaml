---
# ====================================================================
# Health Tracker - Version 1 Deployment & Service
# Roll No: 24MIS0130 | Feature: Enter Data (Input health values)
# ====================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: health-tracker-v1-deployment
  labels:
    app: health-tracker
    version: v1
    student: "24MIS0130"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: health-tracker
      version: v1
  template:
    metadata:
      labels:
        app: health-tracker
        version: v1
        student: "24MIS0130"
    spec:
      containers:
      - name: health-tracker-v1
        image: 24mis0130/health-tracker:v1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: PORT
          value: "3000"
        - name: APP_VERSION
          value: "v1"
        resources:
          limits:
            cpu: "250m"
            memory: "256Mi"
          requests:
            cpu: "100m"
            memory: "128Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: health-tracker-v1-service
  labels:
    app: health-tracker
    version: v1
    student: "24MIS0130"
spec:
  type: NodePort
  selector:
    app: health-tracker
    version: v1
  ports:
  - port: 8081
    targetPort: 3000
    nodePort: 30001
    name: http-v1
